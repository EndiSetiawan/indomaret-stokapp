name: indomaret_stokapp
description: Indomaret StokApp - aplikasi offline untuk lokasi rak dan stok snack.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/indomaret_logo.png
